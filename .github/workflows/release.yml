name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump applied to every @intersign package at once, from the highest version in the tree (beta publishes a prerelease on the beta dist-tag; patch/minor/major on a prerelease graduates it to its base version on latest; none republishes the current version)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - beta
          - none
      dry-run:
        description: "Dry run (no publish)"
        required: false
        type: boolean
        default: false

jobs:
  cli-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke-test the packed CLI and editor runtime
        env:
          INTERSIGN_PORTABLE_BUILD: "1"
        run: |
          bun run build --filter editor
          cd packages/cli
          bun run build
          bun run stage-runtime
          bun run smoke-runtime

  release:
    needs: cli-smoke
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      # Verbose npm logs show the OIDC token exchange and the registry's
      # rejection reason when trusted publishing is misconfigured; tokens are
      # redacted by npm.
      NPM_CONFIG_LOGLEVEL: verbose
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # No registry-url here: with it, actions/setup-node writes an .npmrc whose
      # auth token falls back to the placeholder XXXXX-XXXXX-XXXXX-XXXXX, npm
      # sends that fake token, the registry answers 404, and the OIDC trusted
      # publishing exchange never runs. npm publishes to registry.npmjs.org by
      # default and each publish step passes --access public explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm refuses direct publishing with 2FA-bypass tokens (EOTP, see
      # https://gh.io/npm-gat-bypass2fa-deprecation), so no NODE_AUTH_TOKEN is set
      # and npm >= 11.5 exchanges the GitHub Actions OIDC token itself. Every
      # @intersign package must list this repository, this workflow file and
      # the `npm` environment as a trusted publisher on npmjs.com; a package that
      # does not exist on npm yet needs one manual first publish before that.
      - name: Enable npm trusted publishing
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump versions and sync inter-package references
        run: |
          BUMP=${{ inputs.bump }}
          PACKAGES="core viewer editor nodes mcp ifc-converter cli"

          bump_version() {
            local v=$1
            if [ "$BUMP" = "beta" ]; then
              if [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$ ]]; then
                echo "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-beta.$((BASH_REMATCH[4]+1))"
                return
              fi
              IFS='.' read -r MAJ _ _ <<< "${v%%-*}"
              if [ "$MAJ" -lt 1 ]; then
                echo "1.0.0-beta.1"
              else
                echo "$((MAJ+1)).0.0-beta.1"
              fi
              return
            fi
            if [ "$BUMP" = "none" ]; then echo "$v"; return; fi
            # A prerelease graduates to its base version on any stable bump
            # (1.0.0-beta.5 + major|minor|patch -> 1.0.0), matching npm semver.
            # Splitting "1.0.0-beta.5" on dots would otherwise yield 2.0.0 or
            # break the patch arithmetic.
            if [[ "$v" == *-* ]]; then echo "${v%%-*}"; return; fi
            IFS='.' read -r MAJ MIN PAT <<< "$v"
            if [ "$BUMP" = "major" ]; then MAJ=$((MAJ+1)); MIN=0; PAT=0; fi
            if [ "$BUMP" = "minor" ]; then MIN=$((MIN+1)); PAT=0; fi
            if [ "$BUMP" = "patch" ]; then PAT=$((PAT+1)); fi
            echo "$MAJ.$MIN.$PAT"
          }

          if [ "$BUMP" = "beta" ]; then
            echo "NPM_TAG=beta" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          fi

          # Every @intersign package ships at the same version. The next one is
          # computed once, from the highest version currently in the tree, so a
          # package that ran ahead (a cli-only hotfix) pulls the others up to it
          # instead of being republished under an older number.
          version_key() {
            # Fixed-width key that sorts as a string: MAJOR MINOR PATCH then a
            # stable flag, so 1.0.0 outranks every 1.0.0-beta.N.
            local v=$1
            if [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$ ]]; then
              printf '%08d%08d%08d0%08d\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}" "${BASH_REMATCH[4]}"
            else
              IFS='.' read -r MAJ MIN PAT <<< "$v"
              printf '%08d%08d%08d1%08d\n' "$MAJ" "$MIN" "$PAT" 0
            fi
          }
          BASE=""
          BASE_KEY=""
          for pkg in $PACKAGES; do
            CUR=$(jq -r '.version' packages/$pkg/package.json)
            KEY=$(version_key "$CUR")
            if [ -z "$BASE" ] || [[ "$KEY" > "$BASE_KEY" ]]; then
              BASE=$CUR
              BASE_KEY=$KEY
            fi
          done
          NEW=$(bump_version "$BASE")
          echo "RELEASE_VERSION=$NEW" >> "$GITHUB_ENV"
          echo "Releasing every @intersign package at $NEW (highest version in the tree: $BASE)"

          for pkg in $PACKAGES; do
            CUR=$(jq -r '.version' packages/$pkg/package.json)
            jq --arg v "$NEW" '.version = $v' packages/$pkg/package.json > tmp.json && mv tmp.json packages/$pkg/package.json
            UPPER=$(echo "$pkg" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
            # Also export for the publish/commit/tag steps that follow.
            echo "${UPPER}_VERSION=$NEW" >> $GITHUB_ENV
            echo "Bumped @intersign/$pkg: $CUR → $NEW"
          done

          # Sync inter-package references in dependencies, peerDependencies, and devDependencies.
          # Every @intersign/* range becomes ^NEW.
          for pkg in $PACKAGES; do
            FILE=packages/$pkg/package.json
            for dep in $PACKAGES; do
              jq --arg name "@intersign/$dep" --arg v "^$NEW" '
                if .dependencies[$name] then .dependencies[$name] = $v else . end
                | if .peerDependencies[$name] then .peerDependencies[$name] = $v else . end
                | if .devDependencies[$name] then .devDependencies[$name] = $v else . end
              ' "$FILE" > tmp.json && mv tmp.json "$FILE"
            done
          done

          echo "=== @intersign/* refs after sync ==="
          for pkg in core viewer editor nodes mcp ifc-converter cli; do
            echo "--- packages/$pkg/package.json ---"
            jq '{ dependencies: (.dependencies // {} | with_entries(select(.key | startswith("@intersign/")))), peerDependencies: (.peerDependencies // {} | with_entries(select(.key | startswith("@intersign/")))), devDependencies: (.devDependencies // {} | with_entries(select(.key | startswith("@intersign/")))) }' packages/$pkg/package.json
          done

          # Version and dependency ranges changed after the frozen install.
          # Refresh the lockfile so the release commit remains reproducible.
          bun install

      - name: Validate portable editor runtime
        env:
          INTERSIGN_PORTABLE_BUILD: "1"
        run: |
          bun run build --filter editor
          cd packages/cli
          bun run build
          bun run stage-runtime
          bun run smoke-runtime

      - name: Build & publish core
        working-directory: packages/core
        run: |
          bun run build
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "🏜️ Dry run — would publish @intersign/core@$CORE_VERSION"
            npm publish --dry-run --access public --tag "$NPM_TAG"
          elif npm view "@intersign/core@$CORE_VERSION" version >/dev/null 2>&1; then
            echo "📦 @intersign/core@$CORE_VERSION is already published; continuing release recovery"
          else
            npm publish --access public --tag "$NPM_TAG"
            echo "📦 Published @intersign/core@$CORE_VERSION"
          fi

      - name: Build & publish viewer
        working-directory: packages/viewer
        run: |
          bun run build
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "🏜️ Dry run — would publish @intersign/viewer@$VIEWER_VERSION"
            npm publish --dry-run --access public --tag "$NPM_TAG"
          elif npm view "@intersign/viewer@$VIEWER_VERSION" version >/dev/null 2>&1; then
            echo "📦 @intersign/viewer@$VIEWER_VERSION is already published; continuing release recovery"
          else
            npm publish --access public --tag "$NPM_TAG"
            echo "📦 Published @intersign/viewer@$VIEWER_VERSION"
          fi

      - name: Publish editor
        working-directory: packages/editor
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "🏜️ Dry run — would publish @intersign/editor@$EDITOR_VERSION"
            npm publish --dry-run --access public --tag "$NPM_TAG"
          elif npm view "@intersign/editor@$EDITOR_VERSION" version >/dev/null 2>&1; then
            echo "📦 @intersign/editor@$EDITOR_VERSION is already published; continuing release recovery"
          else
            npm publish --access public --tag "$NPM_TAG"
            echo "📦 Published @intersign/editor@$EDITOR_VERSION"
          fi

      - name: Build & publish nodes
        working-directory: packages/nodes
        run: |
          bun run build
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "🏜️ Dry run — would publish @intersign/nodes@$NODES_VERSION"
            npm publish --dry-run --access public --tag "$NPM_TAG"
          elif npm view "@intersign/nodes@$NODES_VERSION" version >/dev/null 2>&1; then
            echo "📦 @intersign/nodes@$NODES_VERSION is already published; continuing release recovery"
          else
            npm publish --access public --tag "$NPM_TAG"
            echo "📦 Published @intersign/nodes@$NODES_VERSION"
          fi

      - name: Build & publish mcp
        working-directory: packages/mcp
        run: |
          bun run build
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "🏜️ Dry run — would publish @intersign/mcp@$MCP_VERSION"
            npm publish --dry-run --access public --tag "$NPM_TAG"
          elif npm view "@intersign/mcp@$MCP_VERSION" version >/dev/null 2>&1; then
            echo "📦 @intersign/mcp@$MCP_VERSION is already published; continuing release recovery"
          else
            npm publish --access public --tag "$NPM_TAG"
            echo "📦 Published @intersign/mcp@$MCP_VERSION"
          fi

      - name: Build & publish ifc-converter
        run: |
          # ifc-converter depends on @intersign/core (workspace) — build it first
          bun run build --filter @intersign/core 2>/dev/null || (cd packages/core && bun run build)
          cd packages/ifc-converter
          bun run build
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "🏜️ Dry run — would publish @intersign/ifc-converter@$IFC_CONVERTER_VERSION"
            npm publish --dry-run --access public --tag "$NPM_TAG"
          elif npm view "@intersign/ifc-converter@$IFC_CONVERTER_VERSION" version >/dev/null 2>&1; then
            echo "📦 @intersign/ifc-converter@$IFC_CONVERTER_VERSION is already published; continuing release recovery"
          else
            npm publish --access public --tag "$NPM_TAG"
            echo "📦 Published @intersign/ifc-converter@$IFC_CONVERTER_VERSION"
          fi

      - name: Publish CLI
        # Keep token auth unset so npm can exchange the GitHub OIDC identity.
        run: |
          cd packages/cli
          # The tarball embeds the URL and digest of the web runtime archive, so the archive
          # must be staged (by "Validate portable editor runtime") before anything is published.
          ARCHIVE="build/intersign-web-runtime-$CLI_VERSION.tar.gz"
          test -f "$ARCHIVE"
          test -f "$ARCHIVE.sha256"
          test -f dist/services/intersign-mcp.mjs
          jq -e --arg v "$CLI_VERSION" '.version == $v' dist/runtime-source.json
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "🏜️ Dry run — would publish @intersign/cli@$CLI_VERSION"
            npm publish --ignore-scripts --dry-run --access public --tag "$NPM_TAG"
          elif npm view "@intersign/cli@$CLI_VERSION" version >/dev/null 2>&1; then
            echo "📦 @intersign/cli@$CLI_VERSION is already published; continuing release recovery"
          else
            npm publish --ignore-scripts --access public --tag "$NPM_TAG"
            echo "📦 Published @intersign/cli@$CLI_VERSION"
          fi

      - name: Commit version bumps & tag
        if: inputs.dry-run == false
        run: |
          git add -A
          PKGS=""
          TAGS=""
          for pkg in core viewer editor nodes mcp ifc-converter cli; do
            PKGS="$PKGS @intersign/$pkg@$RELEASE_VERSION"
            TAGS="$TAGS @intersign/$pkg@$RELEASE_VERSION"
          done

          if git diff --cached --quiet; then
            echo "No version-file changes; tagging the current release commit"
          else
            git commit -m "release:${PKGS}"
          fi

          # A `none` run republishes the current version: a package that was
          # already released at it keeps its tag, the rest are tagged now.
          NEW_TAGS=""
          for TAG in $TAGS; do
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG already exists; keeping it"
            else
              git tag "$TAG"
              NEW_TAGS="$NEW_TAGS $TAG"
            fi
          done

          git push --atomic origin HEAD:main $NEW_TAGS

      # The npm package points at this asset, so it is uploaded in the same job, immediately
      # after the tag it hangs off exists on the remote.
      - name: Upload the CLI web runtime release asset
        if: inputs.dry-run == false
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="@intersign/cli@$CLI_VERSION"
          ARCHIVE="build/intersign-web-runtime-$CLI_VERSION.tar.gz"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            [ "$NPM_TAG" = "beta" ] && PRERELEASE=--prerelease || PRERELEASE=
            gh release create "$TAG" $PRERELEASE --title "$TAG" --notes "The Intersign web editor runtime for \`@intersign/cli@$CLI_VERSION\`. The CLI downloads \`$(basename "$ARCHIVE")\` the first time a command starts the editor and verifies it against the digest published inside the npm package. Offline installs can pass the archive directly: \`intersign editor --runtime $(basename "$ARCHIVE")\`."
          fi
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          echo "🌐 Uploaded $(basename "$ARCHIVE") to $TAG"
